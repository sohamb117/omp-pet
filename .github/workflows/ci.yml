name: CI and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  check-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - name: Install locked plugin dependencies
        run: bun install --frozen-lockfile
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check OMP plugin
        run: |
          bun run typecheck
          bun test extension
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Bump Cargo.toml before tagging'
          assert json.load(open('package.json'))['version'] == version, 'Keep plugin version in sync'
          PYTHON
      - name: Build and verify app
        run: |
          scripts/build-app.sh release
          codesign --verify --deep --strict 'dist/OMP Pet.app'
          test "$(find 'dist/OMP Pet.app/Contents/Resources' -type f | wc -l | tr -d ' ')" = 0
          'dist/OMP Pet.app/Contents/MacOS/omp-pet' --help
          ditto -c -k --sequesterRsrc --keepParent 'dist/OMP Pet.app' dist/OMP-Pet-macos-arm64.zip
          (cd dist && shasum -a 256 OMP-Pet-macos-arm64.zip > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OMP-Pet-macos-arm64
          path: |
            dist/OMP-Pet-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OMP-Pet-macos-arm64
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/OMP-Pet-macos-arm64.zip dist/SHA256SUMS \
            --verify-tag --draft --title "OMP Pet $RELEASE_TAG" --generate-notes
